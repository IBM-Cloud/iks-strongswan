version: "2"
linters:
  enable:
    - errcheck # on by default
    - gocritic
    - gosec
    - govet # on by default
    - ineffassign # on by default
    - misspell
    - staticcheck # on by default
    - unconvert
    - unparam
    - unused # on by default
  settings:
    gosec:
      excludes:
        - G702 # Command injection via taint analysis
        - G704 # SSRF via taint analysis
        - G706 # Log injection via taint analysis
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
formatters:
  enable:
    - gofmt
